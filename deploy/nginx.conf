# /etc/nginx/sites-available/consultation.herbsmagic.in
# Reference copy. Live vhost uses: include /etc/nginx/snippets/hm-consultation-deny.conf (the three deny rules below).
# /api/ must go to THIS project backend on 5200 (the old vhost points at 5000).
server {
    listen 80;
    server_name consultation.herbsmagic.in;
    # certbot --nginx will add the 443 block / redirect

    root /root/apps/consultation-new;
    index index.html;

    # Never serve server-side files
    location ~ ^/(backend|deploy|logs|\.git|\.github|node_modules)(/|$) { return 404; }
    location ~ /\.(?!well-known) { return 404; }
    location ~ ^/(build\.js|[A-Za-z]+\.jsx|package(-lock)?\.json|ecosystem\.config\.js|deploy\.sh|generate-config\.js|DEPLOYMENT\.md)$ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:5200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only real files and /admin are served; anything else gets the app's "Page not found"
    # screen with a real 404 status (the app also catches unknown paths if this is left as a plain fallback).
    location = /admin { try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /index.html;
}
